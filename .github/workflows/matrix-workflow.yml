name: Test Matrix
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:

  # Single source of truth for the matrix. Both jobs below expand it with
  # fromJSON, so the values only ever get edited here.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.config.outputs.matrix }}
    steps:
      - id: config
        run: |
          echo 'matrix={"data":["ubuntu","windows"]}' >> "$GITHUB_OUTPUT"

  print-something:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.config) }}
    runs-on: ubuntu-latest
    steps:
      - name: ${{ matrix.data }} job
        env:
          OS: ${{ matrix.data }}
        run: |
          echo "OS: $OS"
          if [ "$OS" == "windows" ]; then exit 1; fi

  check-status:
    needs: [matrix, print-something]
    if: always()
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.config) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-job-status
        with:
          job-name: print-something (${{ matrix.data }})
