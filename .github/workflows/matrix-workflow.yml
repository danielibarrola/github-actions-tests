name: Test Matrix
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:

  print-something:
    strategy:
      matrix:
        data: ["ubuntu", "windows"]

    steps:
      - name: ${{ matrix.data }} job
        run: | 
          echo "OS: ${{ matrix.data }}"
          if [ "${{ matrix.data }}" == "windows" ]; then exit 1; fi
          exit 0

    runs-on: ubuntu-latest

  check-status:
    if: always()
    runs-on: ubuntu-latest
    needs: print-something

    permissions:
      actions: read # Required to query the API for job info

    steps:
      - name: Get Matrix Job Statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fetching job details for run ${{ github.run_id }}..."
          
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[] | {name: .name, conclusion: .conclusion, status: .status}'