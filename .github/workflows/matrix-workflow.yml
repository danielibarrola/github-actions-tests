name: Test Matrix
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:

  print-something:
    strategy:
      matrix:
        data: ["ubuntu", "windows"]

    steps:
      - name: ${{ matrix.data }} job
        run: | 
          echo "OS: ${{ matrix.data }}"
          if [ "${{ matrix.data }}" == "windows" ]; then exit 1; fi
          exit 0

    runs-on: ubuntu-latest

  check-status:
    needs: print-something
    if: always()
    strategy:
      matrix:
        data: [ "ubuntu", "windows" ]
    runs-on: ubuntu-latest
    steps:
      - name: Check status for ${{ matrix.data }}
        run: |
          # Get the result of the specific matrix leg from the 'needs' object
          RESULT="${{ needs.print-something.result }}"

          echo "The aggregate result of the needed job is: $RESULT"

          # If we want to check if THIS specific matrix combination failed
          # we look at the 'needs' status. 
          if [ "$RESULT" == "failure" ]; then
            echo "Detected a failure in the dependency. Taking action for ${{ matrix.data }}..."
            # You can add logic here or force this job to fail too:
            exit 1
          fi

          echo "Dependency succeeded for ${{ matrix.data }}."