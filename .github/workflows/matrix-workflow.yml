name: Test Matrix
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:

  print-something:
    strategy:
      matrix:
        data: ["ubuntu", "windows"]

    steps:
      - name: ${{ matrix.data }} job
        run: | 
          echo "OS: ${{ matrix.data }}"
          if [ "${{ matrix.data }}" == "windows" ]; then exit 1; fi
          exit 0

    runs-on: ubuntu-latest

  check-status:
    if: always()
    runs-on: ubuntu-latest
    needs: print-something

    steps:
      - name: Check status
        run: | 
          echo "Printing previous job data"
          echo '${{ toJSON(needs) }}'