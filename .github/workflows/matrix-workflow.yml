name: Test Matrix
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:

  print-something:
    strategy:
      matrix:
        data: ["ubuntu", "windows"]

    steps:
      - name: ${{ matrix.data }} job
        run: | 
          echo "OS: ${{ matrix.data }}"
          if [ "${{ matrix.data }}" == "windows" ]; then exit 1; fi
          exit 0

    runs-on: ubuntu-latest

  check-status:
    needs: print-something
    if: always()
    strategy:
      matrix:
        data: [ "ubuntu", "windows" ]
    runs-on: ubuntu-latest
    steps:
      - name: Check status for ${{ matrix.data }}
        run: |
          # The job name in the API usually follows the pattern "job_id (matrix_value)"
          # We use jq to find the job that matches the matrix name and get its conclusion
          JOB_NAME="print-something (${{ matrix.data }})"
          
          echo "Searching for status of job: $JOB_NAME"
          
          STATUS=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq ".jobs[] | select(.name == \"$JOB_NAME\") | .conclusion")
          
          echo "The conclusion for $JOB_NAME was: $STATUS"
          
          if [ "$STATUS" == "failure" ]; then
            echo "❌ Dependency $JOB_NAME failed. Failing this job."
            exit 1
          elif [ "$STATUS" == "success" ]; then
            echo "✅ Dependency $JOB_NAME succeeded."
          else
            echo "⚠️ Dependency $JOB_NAME has status: $STATUS"
          fi