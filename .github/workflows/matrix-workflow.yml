name: Test Matrix
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:

  print-something:
    strategy:
      matrix:
        data: [1, 2]

    steps:
      - name: Print ${{ matrix.data }}
        run: | 
          echo "Data: ${{ matrix.data }}"

    runs-on: ubuntu-latest

  check-status:
    runs-on: ubuntu-latest
    needs: print-something

    steps:
      - name: Check status
        run: | 
          echo "Printing previous job data"
          echo "${{ needs }}"