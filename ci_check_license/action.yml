name: 'Check License Headers'
description: 'Reusable Action that scans workspace files for Apache or custom license headers, with highly configurable exclusions'
inputs:
  copyright-holder:
    description: 'The copyright holder name to check in the header.'
    required: true
    default: 'The TensorFlow Authors'
  license-type:
    description: 'The license type to verify (e.g., apache, mit, bsd).'
    required: true
    default: 'apache'
  exclude-paths:
    description: 'Comma-separated list of folder paths to prune/exclude.'
    required: false
    default: 'third_party'
  exclude-extensions:
    description: 'Comma-separated list of additional file extensions to exclude (e.g. tflite, tfrecord).'
    required: false
    default: ''
  exclude-files:
    description: 'Comma-separated list of additional specific filenames to exclude (e.g. my_custom_template.yaml).'
    required: false
    default: ''
  scan-path:
    description: 'The directory path where the scan should begin (defaults to repository root).'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: 'Install addlicense if not present'
      shell: bash
      run: |
        if ! command -v addlicense &> /dev/null; then
          echo "addlicense CLI not found. Installing github.com/google/addlicense..."
          go install github.com/google/addlicense@b289835c0741ba2fb92dd5f61af070e79c69a55e # v1.2.0
        fi

    - name: 'Run license header checks'
      shell: bash
      env:
        INPUT_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        INPUT_EXCLUDE_EXTENSIONS: ${{ inputs.exclude-extensions }}
        INPUT_EXCLUDE_FILES: ${{ inputs.exclude-files }}
        INPUT_SCAN_PATH: ${{ inputs.scan-path }}
        INPUT_COPYRIGHT_HOLDER: ${{ inputs.copyright-holder }}
        INPUT_LICENSE_TYPE: ${{ inputs.license-type }}
      run: |
        set -x
        # Ensure Go bin path is active in current execution env
        export PATH=$PATH:$(go env GOPATH)/bin

        # Parse pruned directories
        IFS=', ' read -r -a PRUNE_INPUT_ARR <<< "$INPUT_EXCLUDE_PATHS" || true
        PRUNE_ARGS=()
        for p in "${PRUNE_INPUT_ARR[@]}"; do
          if [[ -n "$p" ]]; then
            # Strip optional leading './' and trailing slashes
            clean_p=$(echo "$p" | sed -e 's|^\./||' -e 's|/$||')
            PRUNE_ARGS+=( "-path" "./$clean_p" "-prune" "-o" )
          fi
        done

        # Standard non-TF-specific exclusions
        DEFAULT_EXCLUSIONS=(
          "*.bazel.lock"
          "*.Dockerfile"
          "Dockerfile"
          "_toc.yaml"
          "_index.yaml"
          "_book.yaml"
          "_doxygen.yaml"
          "_redirects.yaml"
          "cloudbuild.yaml"
          "*.bin"
          "*.bmp"
          "*.bytes"
          "*.cff"
          "*.clang-format"
          "*.clang-tidy"
          "*.csv"
          "*.dat"
          "*.data-*"
          "*.dict"
          "*.diff"
          "*.flac"
          "*.gif"
          "*.golden"
          "*.golden_summary"
          "*.gz"
          "*.ico"
          "*.index"
          "*.ipynb"
          "*.jar"
          "*.jpg"
          "*.json"
          "*.mdb"
          "*.meta"
          "*.parquet"
          "*.patch"
          "*.pb"
          "*.pdf"
          "*.png"
          "*.pyc"
          "*.svg"
          "*.symbols"
          "*.text"
          "*.textproto"
          "*.tsv"
          "*.txt"
          "*.voc"
          "*.vocab"
          "*.wav"
          "*.webp"
          "__init__.py"
          "*.bazel"
          "*.bzl"
          "*.BUILD"
          "*.proto"
          "*.xml"
          "*.html"
        )

        EXCLUDE_ARGS=()
        for item in "${DEFAULT_EXCLUSIONS[@]}"; do
          EXCLUDE_ARGS+=( "!" "-name" "$item" )
        done

        # Add custom user-supplied extension exclusions
        IFS=', ' read -r -a CUSTOM_EXT_ARR <<< "$INPUT_EXCLUDE_EXTENSIONS" || true
        for ext in "${CUSTOM_EXT_ARR[@]}"; do
          if [[ -n "$ext" ]]; then
            clean_ext=$(echo "$ext" | sed 's|^\*\.||')
            EXCLUDE_ARGS+=( "!" "-name" "*.$clean_ext" )
          fi
        done

        # Add custom user-supplied file exclusions
        IFS=', ' read -r -a CUSTOM_FILE_ARR <<< "$INPUT_EXCLUDE_FILES" || true
        for f in "${CUSTOM_FILE_ARR[@]}"; do
          if [[ -n "$f" ]]; then
            EXCLUDE_ARGS+=( "!" "-name" "$f" )
          fi
        done

        echo "Scanning path: $INPUT_SCAN_PATH"
        echo "Running check with exclusions..."
        echo "Pruned directories: $INPUT_EXCLUDE_PATHS"
        echo "Extra extensions: $INPUT_EXCLUDE_EXTENSIONS"
        echo "Extra files excluded: $INPUT_EXCLUDE_FILES"

        set +x
        # Create temporary log file
        TEMP_LOG=$(mktemp)

        set +e
        # Scan files, stream standard output in real-time, and capture to TEMP_LOG
        find "$INPUT_SCAN_PATH" "${PRUNE_ARGS[@]}" -type f -name "*.*" "${EXCLUDE_ARGS[@]}" -print0 | xargs -0 addlicense -c "$INPUT_COPYRIGHT_HOLDER" -l "$INPUT_LICENSE_TYPE" -check 2>&1 | tee "$TEMP_LOG"
        STATUS=${PIPESTATUS[1]}
        set -e

        if [ $STATUS -ne 0 ]; then
          echo "::error::License header check failed. One or more files are missing headers."
          # Read each line of missing files from TEMP_LOG and create GHA annotations
          while IFS= read -r line; do
            # Filter out empty lines, non-existent paths, and tool messages
            if [[ -n "$line" && ! "$line" =~ ^xargs && -f "$line" ]]; then
              echo "::error file=$line::File is missing valid license headers."
              echo "Missing license header: $line"
            fi
          done < "$TEMP_LOG"
          rm -f "$TEMP_LOG"
          exit $STATUS
        else
          echo "::notice::All files scanned under '$INPUT_SCAN_PATH' contain valid license headers."
          rm -f "$TEMP_LOG"
        fi
